{% extends 'base.html' %}

{% block content %}
<section class="page-card" style="max-width:800px; margin:auto;">
  <h2>Roleplay com IA</h2>

  <div id="warning" style="
    display:none;
    background:#fff3cd;
    border:1px solid #ffeeba;
    color:#856404;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    font-size:14px;
  ">
    ⚠️ Selecione materiais de estudo antes de iniciar o roleplay.
  </div>

  <div
    id="chat"
    style="
      height:300px;
      overflow-y:auto;
      overflow-x:hidden;
      border:1px solid #ddd;
      padding:16px;
      margin-bottom:10px;
      border-radius:12px;
      background:#fafafa;
      scroll-behavior:smooth;
      line-height:1.5;
      font-size:14px;
    "
></div>

  <form id="chatForm">

    <div style="
      display:flex;
      gap:10px;
      align-items:center;
      margin-top:10px;
    ">

      <input
        type="text"
        id="message"
        placeholder="Digite sua resposta..."
        required
        disabled
        style="
          flex:1;
          padding:12px;
          border-radius:10px;
          border:1px solid #ccc;
        "
      >

      <button
        type="submit"
        style="
          padding:12px 20px;
          border:none;
          border-radius:10px;
          cursor:pointer;
        "
      >
        Enviar
      </button>

    </div>

    <button
      type="button"
      id="evaluateBtn"
      class="primary-btn"
      style="
        margin-top:15px;
        width:100%;
      "
    >
      Finalizar e Avaliar
    </button>

  </form>
  <div id="scoreResult" style="margin-top:20px;"></div>
</section>

<script>
const warning = document.getElementById("warning");
const input = document.getElementById("message");
const sendButton = document.querySelector("#chatForm button[type='submit']");

// 🔥 função central de controle
function updateRoleplayLock() {
  let materials = [];

  if (typeof getSelectedMaterials === "function") {
    materials = getSelectedMaterials();
  }

  if (!materials || materials.length === 0) {
    warning.style.display = "block";
    input.disabled = true;
    sendButton.disabled = true;
  } else {
    warning.style.display = "none";
    input.disabled = false;
    sendButton.disabled = false;
  }
}

// 🔥 executa ao carregar
updateRoleplayLock();

// 🔥 escuta mudanças vindas da tela de estudo
window.addEventListener("materials-updated", function (e) {
  updateRoleplayLock();
});

let history = [];

const chat = document.getElementById("chat");
const form = document.getElementById("chatForm");
addMessage(
  "assistant",
  "Olá! Eu serei o cliente nesta simulação de roleplay. Vou reagir como um cliente real: posso questionar preço, valor, prioridade, concorrência e pedir mais clareza. Seu objetivo é conduzir a conversa, defender a proposta e tratar objeções. Quando estiver pronto, comece seu pitch."
);

function addMessage(role, text) {
  const div = document.createElement("div");
  div.style.margin = "8px 0";
  div.innerHTML = "<b>" + (role === "user" ? "Você" : "Cliente") + ":</b> " + text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const input = document.getElementById("message");
  const message = input.value;

  addMessage("user", message);
  input.value = "";

  const formData = new FormData();
  formData.append("message", message);
  formData.append("history", JSON.stringify(history));

  const res = await fetch("/api/roleplay", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  console.log("RETORNO ROLEPLAY:", data);

  history = data.history || history;

  const aiText =
    data.response ||
    data.answer ||
    data.message ||
    data.detail ||
    "Não consegui gerar uma resposta agora.";

  addMessage("assistant", aiText);
});

const evaluateBtn = document.getElementById("evaluateBtn");
const resultDiv = document.getElementById("scoreResult");

evaluateBtn.addEventListener("click", async function () {

  if (!history.length) {
    alert("Faça o roleplay antes de avaliar.");
    return;
  }

  evaluateBtn.disabled = true;
  evaluateBtn.innerText = "Avaliando...";

  const formData = new FormData();
  formData.append("history", JSON.stringify(history));

  const res = await fetch("/api/roleplay/evaluate", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  resultDiv.innerHTML = `
    <div style="background:#f9fafb; padding:16px; border-radius:10px;">
      <h3>Score Geral: ${data.score}</h3>

      <p><strong>Clareza:</strong> ${data.clarity}</p>
      <p><strong>Valor:</strong> ${data.value}</p>
      <p><strong>Domínio:</strong> ${data.knowledge}</p>
      <p><strong>Objeções:</strong> ${data.objections}</p>
      <p><strong>Fechamento:</strong> ${data.closing}</p>

      <h4>Pontos fortes</h4>
      <ul>${data.strengths.map(s => `<li>${s}</li>`).join("")}</ul>

      <h4>Melhorias</h4>
      <ul>${data.improvements.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>
  `;

  evaluateBtn.innerText = "Avaliar novamente";
  evaluateBtn.disabled = false;
});

</script>
{% endblock %}
